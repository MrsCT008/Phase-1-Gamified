<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Reward scenes — preview</title>
<link rel="stylesheet" href="style.css" />
<style>
  /* Preview-only chrome. Nothing here ships with the exercises. */
  .preview-wrap { max-width: 760px; margin: 0 auto; padding: 28px 20px 60px; }
  .preview-wrap h1 { font-family: var(--serif); font-weight: normal; font-size: 1.4rem; }
  .preview-note { color: var(--muted); font-size: 0.85rem; max-width: 52ch; }
  .preview-controls { display: flex; gap: 8px; flex-wrap: wrap; margin: 16px 0 22px; }
  .preview-controls .btn { padding: 8px 13px; font-size: 0.85rem; }
</style>
</head>
<body>
  <div class="preview-wrap">
    <h1>Reward scenes — preview</h1>
    <p class="preview-note">
      A bench for tuning the two animations without playing a whole level.
      Open this file straight from the folder; it uses the same
      <code>style.css</code> and <code>game.js</code> the exercises do, so
      anything you change there shows up here.
    </p>

    <div class="card">
      <h2>Listen stage — feed the penguin</h2>
      <div id="peng-host"></div>
      <div class="preview-controls">
        <button class="btn" onclick="P.feed()">Correct answer</button>
        <button class="btn" onclick="P.miss()">Wrong answer</button>
        <button class="btn btn-secondary" onclick="buildPenguin()">Reset</button>
      </div>
    </div>

    <div style="height:20px"></div>

    <div class="card">
      <h2>Spell stage — drop the hammer</h2>
      <div id="ham-host"></div>
      <div class="preview-controls">
        <button class="btn" onclick="H.chargeUp()">Correct answer</button>
        <button class="btn" onclick="smashAt(6)">Smash — 6 of 6</button>
        <button class="btn" onclick="smashAt(3)">Smash — 3 of 6</button>
        <button class="btn" onclick="smashAt(1)">Smash — 1 of 6</button>
        <button class="btn" onclick="smashAt(0)">Smash — 0 of 6</button>
        <button class="btn btn-secondary" onclick="buildHammer()">Reset</button>
      </div>
      <div id="verdict-host"></div>
    </div>
  </div>

<script src="game.js"></script>
<script>
  var P, H;
  var TOTAL = 6;

  function buildPenguin() {
    var host = document.getElementById("peng-host");
    host.innerHTML = "";
    P = Scenes.penguin({ total: TOTAL, fed: 0 });
    host.appendChild(P.node);
  }

  function buildHammer(charge) {
    var host = document.getElementById("ham-host");
    host.innerHTML = "";
    document.getElementById("verdict-host").innerHTML = "";
    H = Scenes.hammer({ total: TOTAL, charge: charge || 0 });
    host.appendChild(H.node);
  }

  function smashAt(correct) {
    buildHammer(correct);
    var ratio = correct / TOTAL;
    // Give the arm a frame to settle at its charged angle before it drops.
    setTimeout(function () {
      H.smash(ratio).then(function () {
        var p = document.createElement("p");
        p.className = "verdict";
        p.textContent = Scenes.verdictFor(ratio).headline;
        document.getElementById("verdict-host").appendChild(p);
      });
    }, 60);
  }

  buildPenguin();
  buildHammer();
</script>
</body>
</html>
